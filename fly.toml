# fly.toml app configuration file for this app.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'manager-jakob'
primary_region = 'fra'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  DOTNET_GCConserveMemory = '9'
  DOTNET_GCHeapCount = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep 1 machine running to avoid cold starts and WebSocket issues
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[deploy]
  release_command = 'dotnet ManagerGame.dll --migrate-db'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
